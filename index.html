<style>
/* Layout: one-column phone app — balance hero, partner activity, month tiles, recent list; tab bar fixed bottom; full-height sheets with an on-screen keypad */
:root{
  --bg:#f3f1ec; --surface:#ffffff; --surface2:#ebe8e1; --line:#ddd8cd;
  --fg:#22201c; --muted:#77716a;
  --accent:#b8871b; --accentInk:#1f1a10; --accentSoft:#f3e6c4;
  --a:#2f7d68; --aSoft:#d7ebe4; --aBg:#e8f2ee;
  --b:#c0566b; --bSoft:#f5dde2; --bBg:#f8eaed;
  --onTint:#ffffff; --danger:#b3412f; --warn:#9a6a00;
  --c-eat:#d9822b; --c-cafe:#8a5a3c; --c-grocery:#4f9a52; --c-daily:#3f8fa8; --c-transport:#5b6bbf; --c-leisure:#b9548f; --c-home:#a08a2e; --c-utility:#2f8f86; --c-medical:#c9534f; --c-beauty:#d46a9a; --c-clothes:#7a68b8; --c-telecom:#4a86c4; --c-travel:#2e9fb5; --c-gift:#c9892e; --c-p0:#d9822b; --c-p1:#4f9a52; --c-p2:#3f8fa8; --c-p3:#5b6bbf; --c-p4:#b9548f; --c-p5:#a08a2e; --c-p6:#2f8f86; --c-p7:#c9534f; --c-other:#8c8780; --c-none:#cfc9bd;
  --font:"Meiryo UI","Zen Kaku Gothic New","Hiragino Sans","Yu Gothic UI",system-ui,sans-serif;
  --numf:"Manrope","Zen Kaku Gothic New",system-ui,sans-serif;
  --spring:cubic-bezier(.2,.9,.25,1.15);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17181a; --surface:#222326; --surface2:#2c2d31; --line:#36373b;
  --fg:#efece6; --muted:#9b978f;
  --accent:#e0b44c; --accentInk:#1a1406; --accentSoft:#3a3020;
  --a:#5fbfa3; --aSoft:#1f3630; --aBg:#162320;
  --b:#e8899b; --bSoft:#3d252b; --bBg:#25191c;
  --onTint:#101211; --danger:#e57a66; --warn:#e0b44c; --c-eat:#eb9a4c; --c-cafe:#c08a66; --c-grocery:#73bf73; --c-daily:#62b4cc; --c-transport:#8a97e6; --c-leisure:#e07cb6; --c-home:#cdb352; --c-utility:#5cc2b6; --c-medical:#e57f7a; --c-beauty:#ec8fb7; --c-clothes:#a493dc; --c-telecom:#79aee6; --c-travel:#62c4d6; --c-gift:#e6ab5c; --c-p0:#eb9a4c; --c-p1:#73bf73; --c-p2:#62b4cc; --c-p3:#8a97e6; --c-p4:#e07cb6; --c-p5:#cdb352; --c-p6:#5cc2b6; --c-p7:#e57f7a; --c-other:#a9a49c; --c-none:#4a4b4f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17181a; --surface:#222326; --surface2:#2c2d31; --line:#36373b;
  --fg:#efece6; --muted:#9b978f;
  --accent:#e0b44c; --accentInk:#1a1406; --accentSoft:#3a3020;
  --a:#5fbfa3; --aSoft:#1f3630; --aBg:#162320;
  --b:#e8899b; --bSoft:#3d252b; --bBg:#25191c;
  --onTint:#101211; --danger:#e57a66; --warn:#e0b44c; --c-eat:#eb9a4c; --c-cafe:#c08a66; --c-grocery:#73bf73; --c-daily:#62b4cc; --c-transport:#8a97e6; --c-leisure:#e07cb6; --c-home:#cdb352; --c-utility:#5cc2b6; --c-medical:#e57f7a; --c-beauty:#ec8fb7; --c-clothes:#a493dc; --c-telecom:#79aee6; --c-travel:#62c4d6; --c-gift:#e6ab5c; --c-p0:#eb9a4c; --c-p1:#73bf73; --c-p2:#62b4cc; --c-p3:#8a97e6; --c-p4:#e07cb6; --c-p5:#cdb352; --c-p6:#5cc2b6; --c-p7:#e57f7a; --c-other:#a9a49c; --c-none:#4a4b4f; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
html,body{min-height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body.noscroll{overflow:hidden}
.app{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(120px + env(safe-area-inset-bottom,0px))}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-user-select:none;user-select:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--numf);font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
h1{font-size:13px;letter-spacing:.12em;color:var(--muted);font-weight:500;margin:0}
h2{font-size:13px;letter-spacing:.06em;color:var(--muted);font-weight:500;margin:0 0 8px}
.view{display:flex;flex-direction:column;gap:20px}
.press{transition:transform .12s}
.press:active{transform:scale(.97)}

/* ---------- Balance hero ---------- */
.balance{background:var(--surface);border-radius:24px;padding:22px 20px 18px;display:flex;flex-direction:column;gap:12px}
.flow{display:flex;align-items:center;gap:8px;font-weight:700;flex-wrap:wrap}
.who{padding:3px 12px;border-radius:999px;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.who.a{background:var(--aSoft);color:var(--a)} .who.b{background:var(--bSoft);color:var(--b)}
.ini{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;font-size:11px;font-weight:900;color:var(--onTint)}
.a .ini,.ini.a{background:var(--a)} .b .ini,.ini.b{background:var(--b)}
.arrow{color:var(--muted);font-size:13px;font-weight:500}
.hero{font-family:var(--numf);font-weight:800;font-size:56px;letter-spacing:-.02em;line-height:1;display:flex;align-items:flex-end}
.hero .yen{font-size:28px;font-weight:700;margin-right:4px;padding-bottom:5px}
.dg{display:inline-block;height:1em;overflow:hidden;line-height:1}
.dg .col{display:flex;flex-direction:column}
.dg .col span{height:1em;line-height:1;text-align:center}
.roll .dg .col{transition:transform .9s var(--spring)}
.sep{display:inline-block;line-height:1}
.sub{color:var(--muted);font-size:13px}
.even{font-size:22px;font-weight:700}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px}
.act{background:var(--surface2);border:0;border-radius:14px;padding:11px 6px;font-size:13px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:4px}
.act svg{width:20px;height:20px}
.act.primary{background:var(--accent);color:var(--accentInk)}

/* ---------- Activity / status ---------- */
.activity{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:16px;padding:11px 14px;border:0;width:100%;text-align:left;font-size:14px}
.activity .txt{min-width:0;flex:1;overflow-wrap:anywhere}
.activity .when{color:var(--muted);font-size:12px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none;display:inline-block}
.head{display:flex;align-items:center;justify-content:space-between;margin-right:-6px}
#ptr{position:fixed;top:calc(env(safe-area-inset-top,0px) + 6px);left:50%;width:40px;height:40px;border-radius:50%;background:var(--surface);box-shadow:0 2px 10px rgba(0,0,0,.15);display:grid;place-items:center;opacity:0;transform:translate(-50%,-44px);z-index:30;pointer-events:none;color:var(--muted)}
#ptr svg{width:20px;height:20px}
#ptr.ready{color:var(--a)}
.rbtn{width:44px;height:44px;border:0;background:none;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.rbtn svg{width:22px;height:22px}
.rbtn:active{background:var(--surface2)}
.rbtn.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.status{font-size:12px;color:var(--muted);display:flex;justify-content:flex-end;align-items:center;gap:6px;margin-top:-10px}
.status.off{color:var(--warn);font-weight:700}

/* ---------- Tiles & lists ---------- */
.split{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:var(--surface);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .lbl{font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px}
.tile .val{font-size:22px;font-weight:800}
.tile.a .lbl{color:var(--a)} .tile.b .lbl{color:var(--b)}
.recap-cta{display:flex;align-items:center;gap:12px;background:var(--accentSoft);border:0;border-radius:18px;padding:14px 16px;text-align:left;width:100%}
.recap-cta b{display:block;font-size:16px}
.recap-cta span{font-size:12px;color:var(--muted)}
.recap-cta .go{margin-left:auto;font-size:20px;color:var(--accent)}
.list{background:var(--surface);border-radius:18px;overflow:hidden}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 16px;border:0;border-top:1px solid var(--line);background:none;width:100%;text-align:left;align-items:center}
.row:first-child{border-top:0}
.row:active{background:var(--surface2)}
.row .t{font-weight:700;min-width:0;overflow-wrap:anywhere;display:flex;align-items:center;gap:6px}
.row .d{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row .amt{grid-row:1 / span 2;grid-column:2;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.row .amt b{font-family:var(--numf);font-weight:800;font-size:18px}
.rx{font-size:13px;letter-spacing:.05em}
.tag{font-size:11px;padding:1px 8px;border-radius:999px;font-weight:700;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.tag.a{background:var(--aSoft);color:var(--a)} .tag.b{background:var(--bSoft);color:var(--b)}
.tag.k{background:var(--surface2);color:var(--muted)}
.empty{padding:28px 18px;text-align:center;color:var(--muted);font-size:14px}
.mcard{background:var(--surface);border-radius:18px;padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px;margin-bottom:10px}
.mnav{display:flex;align-items:center;gap:6px}
.mstep{width:40px;height:40px;border-radius:50%;border:0;background:var(--surface2);font-size:22px;font-weight:800;line-height:1;display:grid;place-items:center;padding:0}
.mstep:disabled{opacity:.3}
.mlabel{border:0;background:none;font-size:18px;font-weight:800;padding:6px 8px}
.mpill{margin-left:auto;background:var(--aSoft);color:var(--a);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:800}
.msum{display:flex;flex-direction:column}
.msum small{font-size:12px;color:var(--muted);font-weight:700}
.msum b{font-family:var(--numf);font-size:28px;font-weight:800}
.mtiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mt{border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.mt small{font-size:12px;font-weight:800}
.mt b{font-family:var(--numf);font-size:19px;font-weight:800}
.mt.a{background:var(--aBg)}.mt.a small{color:var(--a)}
.mt.b{background:var(--bBg)}.mt.b small{color:var(--b)}
.monthhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:6px 2px 8px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.monthhead b{color:var(--fg);font-size:15px}
.mini{border:1px solid var(--line);background:none;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;color:var(--fg)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-size:14px;font-weight:700}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 14px;font-size:16px;-webkit-appearance:none;appearance:none}

/* ---------- Tab bar ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));z-index:20}
.tabs .in{display:grid;grid-template-columns:repeat(4,1fr);width:100%;max-width:520px}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:6px 0;position:relative}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--fg);font-weight:700}
.badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:16px;height:16px;border-radius:8px;background:var(--accent);color:var(--accentInk);font:800 10px/16px var(--numf);padding:0 4px}
.fab{position:fixed;right:max(18px,calc(env(safe-area-inset-right,0px) + 18px));bottom:calc(80px + env(safe-area-inset-bottom,0px));width:62px;height:62px;border-radius:50%;border:0;background:var(--accent);color:var(--accentInk);box-shadow:0 8px 20px rgba(0,0,0,.22);z-index:21;display:grid;place-items:center}
.fab svg{width:28px;height:28px}

/* ---------- Sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40}
.sheet{--tint:var(--accent);--tintBg:var(--bg);--tintSoft:var(--surface2);
  position:fixed;left:0;right:0;bottom:0;top:calc(10px + env(safe-area-inset-top,0px));z-index:41;background:var(--tintBg);border-radius:22px 22px 0 0;overflow:auto;overscroll-behavior:contain;
  padding-block:8px calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  transition:background-color .35s ease}
.sheet[data-payer="a"]{--tint:var(--a);--tintBg:var(--aBg);--tintSoft:var(--aSoft)}
.sheet[data-payer="b"]{--tint:var(--b);--tintBg:var(--bBg);--tintSoft:var(--bSoft)}
.sheet .in{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:10px;min-height:100%}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:2px auto 0}
.shead{display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.shead h3{margin:0;font-size:16px}
.link{border:0;background:none;font-weight:700;padding:8px 4px;font-size:15px;color:var(--muted);justify-self:start}
.seg.three{grid-template-columns:repeat(3,1fr)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--surface2);border-radius:14px;padding:4px}
.seg button{border:0;background:none;border-radius:11px;padding:11px 8px;font-weight:700;color:var(--muted);font-size:15px;display:flex;justify-content:center;align-items:center;gap:6px;transition:background-color .25s,color .25s}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg.who2 button[aria-pressed="true"].a{background:var(--a);color:var(--onTint)}
.seg.who2 button[aria-pressed="true"].b{background:var(--b);color:var(--onTint)}
.seg.who2 button[aria-pressed="true"] .ini{background:var(--onTint);color:var(--fg)}
.seg.sm button{padding:8px 6px;font-size:13px}
.amtview{background:var(--surface);border-radius:18px;padding:10px 16px 12px;display:flex;flex-direction:column;align-items:flex-end;gap:2px;min-height:74px;justify-content:flex-end}
.amtview .expr{font-family:var(--numf);font-weight:600;font-size:15px;color:var(--muted);min-height:1.4em;text-align:right;overflow-wrap:anywhere}
.amtview .total{font-family:var(--numf);font-weight:800;font-size:40px;line-height:1;color:var(--tint);letter-spacing:-.01em}
.amtview .total.zero{color:var(--line)}
.amtview{border:2px solid var(--tint);cursor:text;transition:transform .12s,box-shadow .2s;box-shadow:0 0 0 4px color-mix(in srgb,var(--tint) 14%,transparent);-webkit-tap-highlight-color:transparent}
.amtview.tap{animation:amtTap .28s ease-out}
@keyframes amtTap{0%{transform:scale(1);box-shadow:0 0 0 4px color-mix(in srgb,var(--tint) 14%,transparent)}35%{transform:scale(.985);box-shadow:0 0 0 9px color-mix(in srgb,var(--tint) 26%,transparent)}100%{transform:scale(1);box-shadow:0 0 0 4px color-mix(in srgb,var(--tint) 14%,transparent)}}
.amtview .total::after{content:"";display:inline-block;width:3px;height:.85em;margin-left:5px;border-radius:2px;background:var(--tint);vertical-align:-.08em;animation:caret 1.05s steps(1) infinite}
@keyframes caret{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.amtview .total::after{animation:none}.amtview.tap{animation:none}}
.tile.p{border:0;text-align:left;font:inherit;color:inherit;cursor:pointer;width:100%}
.tile .go{margin-left:auto;color:var(--muted);font-size:16px;font-weight:700}
.prow{width:100%;border:0;background:none;display:grid;grid-template-columns:1fr auto;gap:2px 10px;text-align:left;padding:11px 14px;font:inherit;color:var(--ink);border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.prow .t{font-weight:700;font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .n{font-weight:800;font-family:var(--numf);font-size:16px}
.prow .d{grid-column:1/3;font-size:12px;color:var(--muted);font-weight:600}
.amtview .total small{font-size:24px;font-weight:700;margin-right:3px}
.title-in{width:100%;border:0;background:var(--surface);border-radius:14px;padding:12px 14px;font-size:16px;-webkit-appearance:none;appearance:none}
.sugg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:-4px -2px 0;padding:0 2px}
.sugg::-webkit-scrollbar{display:none}
.sugg button{flex:none;border:0;background:var(--tintSoft);border-radius:999px;padding:6px 13px;font-size:13px;font-weight:700}
.cats{display:flex;flex-wrap:nowrap;gap:6px;margin:0 -2px;padding:2px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.cats::-webkit-scrollbar{display:none}
.cats button{flex:none;border:1.5px solid transparent;background:var(--surface);border-radius:12px;padding:7px 11px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:5px;transition:border-color .2s,background-color .2s}
.cats button[aria-pressed="true"]{border-color:var(--tint);background:var(--tintSoft)}
.catcard{background:var(--surface);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.catbar{display:flex;height:14px;border-radius:7px;overflow:hidden;gap:2px;background:var(--surface2)}
.catbar i{display:block;height:100%;min-width:3px}
.trbars{display:flex;align-items:flex-end;gap:6px;height:170px;padding-top:6px}
.trcol{border:0;background:none;padding:0;font:inherit;cursor:pointer;flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px}
.trtop{font-size:10px;font-weight:800;color:var(--muted);white-space:nowrap;font-family:var(--numf)}
.trstack{width:100%;max-width:34px;display:flex;flex-direction:column-reverse;border-radius:7px;overflow:hidden;background:var(--surface2);min-height:3px}
.trstack.cut{position:relative}
.trstack.cut::before{content:"";position:absolute;left:-3px;right:-3px;top:22%;height:6px;background:var(--surface);transform:rotate(-8deg);z-index:2}
.trstack i{display:block;width:100%}
.trm{white-space:nowrap;font-size:10.5px;letter-spacing:-.02em;font-weight:700;color:var(--muted)}
.trm.now{color:var(--ink);font-weight:800}

<div id="layer"></div>

<script>
(() => {
// ★ GASを「ウェブアプリ」としてデプロイしたURL（…/exec）を貼り付けてください
const API_URL = "https://script.google.com/macros/s/AKfycbxHhlWh5W_j2Q6VyiPD0_eUEmMN4fPudFTbt7OdOGoNnAtrX3PD2THZ1rq3nVzBpx6P4Q/exec";

const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const comma = n => Math.round(Math.abs(n)).toLocaleString("ja-JP");
const yen = n => "¥" + comma(n);
const today = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const ym = s => (s || "").slice(0,7);
const WD = ["日","月","火","水","木","金","土"];
const fmtDate = s => { if(!s) return ""; const [y,m,d] = s.split("-"); return `${y}年${+m}月${+d}日`; };
const shortDate = s => { if(!s) return ""; const d = new Date(s + "T00:00:00"); const t = today(); if(s === t) return "今日"; const y = new Date(t + "T00:00:00"); y.setDate(y.getDate()-1); if(d.getTime() === y.getTime()) return "昨日"; return `${d.getMonth()+1}/${d.getDate()}（${WD[d.getDay()]}）`; };
const ago = ms => { const s = (Date.now() - ms) / 1000; if(s < 60) return "たった今"; if(s < 3600) return `${Math.floor(s/60)}分前`; if(s < 86400) return `${Math.floor(s/3600)}時間前`; return `${Math.floor(s/86400)}日前`; };
const prevMonth = m => { const d = new Date(m + "-01T00:00:00"); d.setMonth(d.getMonth()-1); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`; };
const ls = { get(k,f){ try{ const v = localStorage.getItem(k); return v==null?f:v; }catch{ return f; } }, set(k,v){ try{ localStorage.setItem(k,v); }catch{} } };
const applyTheme = t => {
  const r = document.documentElement;
  if(t === "light" || t === "dark") r.dataset.theme = t; else delete r.dataset.theme;
  const col = t === "dark" ? "#17181a" : t === "light" ? "#f3f1ec" : null;
  const metas = document.querySelectorAll('meta[name="theme-color"]');
  if(metas[0]) metas[0].content = col || "#f3f1ec";
  if(metas[1]) metas[1].content = col || "#17181a";
};
applyTheme(ls.get("theme", "auto"));
function updateBadge(){
  try{
    if(!navigator.setAppBadge || ls.get("badge", "") !== "1") return;
    const n = S.locked ? 0 : newFromPartner().length;
    if(n > 0) navigator.setAppBadge(n); else navigator.clearAppBadge && navigator.clearAppBadge();
  }catch{}
}
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const REACTIONS = ["🙏","😋","☕️","❤️","👍"];
const DEFAULT_CATS = [
  { id:"eat", icon:"🍽", label:"外食" },
  { id:"cafe", icon:"☕️", label:"カフェ" },
  { id:"grocery", icon:"🛒", label:"食料品" },
  { id:"daily", icon:"🧻", label:"日用品" },
  { id:"transport", icon:"🚃", label:"交通" },
  { id:"leisure", icon:"🎉", label:"エンタメ" },
  { id:"home", icon:"🏠", label:"住まい" },
  { id:"utility", icon:"💡", label:"水道光熱費" },
  { id:"medical", icon:"🏥", label:"医療" },
  { id:"beauty", icon:"💄", label:"美容" },
  { id:"clothes", icon:"👕", label:"衣類" },
  { id:"telecom", icon:"📱", label:"通信" },
  { id:"travel", icon:"✈️", label:"旅行" },
  { id:"gift", icon:"🎁", label:"ギフト" },
  { id:"other", icon:"📦", label:"その他" }
];
let CATS = DEFAULT_CATS;
const cleanTxt = (v, n) => Array.from(String(v == null ? "" : v).replace(/[<>&"'`\\]/g, "")).slice(0, n).join("").trim();
const applyCats = () => {
  const c = S.settings && S.settings.cats;
  const list = Array.isArray(c) ? c.filter(x => x && /^[a-z]{1,20}$/.test(String(x.id))).map(x => ({ id: String(x.id), icon: cleanTxt(x.icon, 6) || "🏷", label: cleanTxt(x.label, 10), ...(x.col != null ? { col: Math.max(0, Math.min(7, Math.floor(Number(x.col)) || 0)) } : {}) })).filter(x => x.label) : [];
  CATS = list.length ? list : DEFAULT_CATS;
};
const NONE = { id:"none", icon:"", label:"未分類" };
const catOf = id => CATS.find(c => c.id === id) || NONE;
const catColor = id => { const c = catOf(id); return c.col != null ? `var(--c-p${c.col})` : `var(--c-${c.id})`; };
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

const S = {
  settings: { nameA: "しゅん", nameB: "もえ", defaultShare: 0.5 },
  entries: [], settlements: [],
  me: ls.get("me", ""), tab: "home",
  filter: "this", limit: 300, q: "", cat: "", ready: false, err: "", pass: ls.get("pass", ""), locked: false,
  synced: 0, offline: false,
  seenAt: +ls.get("seenAt", "0") || 0, dotSince: 0,
  heroDigits: ""
};
if(!S.seenAt){ S.seenAt = Date.now(); ls.set("seenAt", String(S.seenAt)); }
S.dotSince = S.seenAt;
const name = p => p === "a" ? S.settings.nameA : S.settings.nameB;
const ini = p => (name(p) || "?").slice(0,1);
const other = p => p === "a" ? "b" : "a";
const me = () => S.me || "a";

/* ================= 通信・オフライン送信待ち ================= */
let Q = []; try{ Q = JSON.parse(ls.get("queue", "[]")) || []; }catch{ Q = []; }
const saveQ = () => ls.set("queue", JSON.stringify(Q));

async function api(fn, ...args){
  let r;
  try{ r = await fetch(API_URL, { method: "POST", body: JSON.stringify({ fn, pass: S.pass, args }) }); }
  catch{ const e = new Error("NETWORK"); e.network = true; throw e; }
  let j; try{ j = await r.json(); }catch{ throw new Error("BAD_RESPONSE"); }
  if(j.error) throw new Error(j.error);
  return j.data;
}
let epoch = 0; // 保存操作のたびに増やす。古い getAll の結果で画面を巻き戻さないため
function enqueue(fn, args){ epoch++; Q.push({ fn, args }); saveQ(); renderStatus(); flush(); }
let flushing = false;
async function flush(){
  if(flushing || !Q.length) return;
  flushing = true;
  let last = null, dropped = false;
  while(Q.length){
    try{ last = await api(Q[0].fn, ...Q[0].args); Q.shift(); saveQ(); S.offline = false; }
    catch(err){
      if(err.network){ S.offline = true; break; }
      const m = String(err.message);
      if(/BAD_PASS|LOCKED|SETUP_PASSCODE|BAD_RESPONSE/.test(m)){ flushing = false; return handleErr(err); } // 送信待ちは消さずに残す
      if(/金額|払った人|リアクション|使えない|UNKNOWN_FN/.test(m)){ Q.shift(); saveQ(); dropped = true; toast("保存できなかった記録が1件あります。もう一度登録してください"); continue; }
      // サーバーが一時的に忙しいだけの可能性が高い：残して、あとでもう一度送る（5回までがんばる）
      Q[0].tries = (Q[0].tries || 0) + 1;
      if(Q[0].tries >= 5){ Q.shift(); dropped = true; toast("保存できなかった記録が1件あります。もう一度登録してください"); }
      saveQ(); break;
    }
  }
  flushing = false;
  if(dropped) setTimeout(load, 0);
  else if(!Q.length && last) apply(last); else renderStatus();
}
function apply(d){
  if(!d || Q.length) return;
  if(d.settings) Object.assign(S.settings, d.settings);
  applyCats();

function entryCredit(e){
  const sign = e.payer === "a" ? 1 : -1;
  if(e.type === "loan") return sign * e.amount;
  const share = typeof e.share === "number" ? e.share : 0.5;
  return sign * Math.round(e.amount * share);
}

function catStats(list){
  const m = new Map();
  for(const e of list){
    if(e.type === "loan" && !e.category) continue;
    const id = catOf(e.category).id;
    const c = m.get(id) || { id, n:0, sum:0 }; c.n++; c.sum += e.amount; m.set(id, c);
  }
  const total = [...m.values()].reduce((a,c) => a + c.sum, 0);
  return { total, rows: [...m.values()].sort((a,b) => b.sum - a.sum) };
}

function evalExpr(str){
  const s = String(str).replace(/×/g,"*").replace(/÷/g,"/").replace(/−/g,"-").replace(/[^0-9+\-*\/.]/g,"");
  if(!s) return NaN;
  let i = 0;
  const num = () => { const m = /^[0-9]*\.?[0-9]+/.exec(s.slice(i)); if(!m) throw 0; i += m[0].length; return parseFloat(m[0]); };
  const term = () => { let v = num(); while(s[i] === "*" || s[i] === "/"){ const o = s[i++]; const r = num(); v = o === "*" ? v * r : v / r; } return v; };
  const expr = () => { let v = term(); while(s[i] === "+" || s[i] === "-"){ const o = s[i++]; const r = term(); v = o === "+" ? v + r : v - r; } return v; };
  try{ const v = expr(); return i === s.length && Number.isFinite(v) ? Math.round(v) : NaN; }catch{ return NaN; }
}
const isOp = c => c === "+" || c === "−" || c === "×" || c === "÷";
function keyInput(expr, k){
  const last = expr.slice(-1);
  const lastNum = expr.split(/[+−×÷]/).pop();
  if(k === "C") return "";
  if(k === "⌫") return expr.slice(0, -1);
  if(isOp(k)){ if(!expr) return expr; return isOp(last) ? expr.slice(0,-1) + k : expr + k; }
  if(expr.length >= 22) return expr;
  if(k === "00"){ if(!lastNum || lastNum === "0") return expr; return expr + "00"; }
  if(lastNum === "0") return expr.slice(0,-1) + k;
  if(lastNum.length >= 8) return expr;
  return expr + k;
}

function listBodyHTML(){
  const thisM = ym(today()), lastM = prevMonth(thisM);
  let items = sorted(S.entries);
  const cm = curMonth();
  if(cm) items = items.filter(e => ym(e.date) === cm);
  if(S.cat) items = items.filter(e => catOf(e.category).id === S.cat && !(e.type === "loan" && !e.category));
  const q = S.q.trim();
  if(q){
    const tokens = searchNorm(q).split(" ").map(t => t.replace(/[¥,円]/g, "")).filter(Boolean);   // 空白で区切ると「AかつB」で絞り込む
    items = items.filter(e => {
      const hay = searchNorm([e.title, name(e.payer), e.category ? catOf(e.category).label : "", e.amount, e.date].join(" "));
      return tokens.every(t => hay.includes(t));
    });
  }
  const total = items.length;
  const allGroups = new Map();   // 月ごとの合計は、表示件数に関係なく全件で計算する
  for(const e of items){ const k = ym(e.date); if(!allGroups.has(k)) allGroups.set(k, []); allGroups.get(k).push(e); }
  items = items.slice(0, S.limit);                       // 件数が多いときは、新しい順に一部だけ描画（速さのため）
  const groups = new Map();
  for(const e of items){ const k = ym(e.date); if(!groups.has(k)) groups.set(k, []); groups.get(k).push(e); }
  let body = "";
  for(const [k, arr] of groups){
    const full = allGroups.get(k) || arr;
    const ta = full.filter(e => e.payer==="a" && e.type!=="loan").reduce((s,e) => s+e.amount, 0);
    const tb = full.filter(e => e.payer==="b" && e.type!=="loan").reduce((s,e) => s+e.amount, 0);
    body += `<section>${cm ? "" : `<div class="monthhead"><b>${k.slice(0,4)}年${+k.slice(5)}月</b><span class="num">${esc(S.settings.nameA)} ${yen(ta)} ・ ${esc(S.settings.nameB)} ${yen(tb)}</span>${k < thisM ? `<button class="mini" data-recap="${k}">振り返り</button>` : ""}</div>`}

  }
  if(!body) body = `<div class="list"><div class="empty">${q ? "見つかりませんでした" : "この期間の記録はありません"}</div></div>`;
  if(cm) body = monthCardHTML(cm, items) + body;
  if(total > items.length) body += `<button type="button" class="btn" data-more style="width:100%;margin-top:12px">さらに表示（残り${(total - items.length).toLocaleString("ja-JP")}件）</button>`;
  return body;
}

  "+":'<svg class="opi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5.5v13M5.5 12h13"/></svg>'

function keypadHTML(label){

  return `<div class="keys">

function bindKeypad(sheet, st, onChange){
  const press = key => { st.expr = keyInput(st.expr, key); onChange(); };
  let lpT = null, lpDone = false;
  sheet.addEventListener("click", ev => { const b = ev.target.closest("[data-key]"); if(!b) return; if(lpDone){ lpDone = false; return; } press(b.dataset.key); });
  sheet.addEventListener("pointerdown", ev => { lpDone = false; const b = ev.target.closest('[data-key="⌫"]'); if(!b) return; lpT = setTimeout(() => { lpDone = true; press("C"); }, 500); });
  ["pointerup","pointerleave","pointercancel"].forEach(t => sheet.addEventListener(t, () => clearTimeout(lpT)));
  sheet.addEventListener("contextmenu", ev => { if(ev.target.closest("[data-key]")) ev.preventDefault(); });
  sheet.addEventListener("keydown", ev => {
    if(ev.target.tagName === "INPUT") return;
    const map = { "+":"+", "-":"−", "*":"×", "x":"×", "/":"÷", "Backspace":"⌫", "Delete":"C", "Escape":null };
    if(/^[0-9]$/.test(ev.key)) { press(ev.key); ev.preventDefault(); }
    else if(ev.key in map && map[ev.key]) { press(map[ev.key]); ev.preventDefault(); }
    else if(ev.key === "Enter" && !ev.target.closest("button")){ const s = $("#save", sheet); if(!s.disabled) s.click(); ev.preventDefault(); }
  });
}

/* ================= CSVの取り込み ================= */
function parseCsv(text){
  text = String(text).replace(/^﻿+/, "");
  const rows = []; let row = [], cur = "", q = false;
  for(let i = 0; i < text.length; i++){
    const c = text[i];
    if(q){ if(c === '"'){ if(text[i + 1] === '"'){ cur += '"'; i++; } else q = false; } else cur += c; }
    else if(c === '"') q = true;
    else if(c === ","){ row.push(cur); cur = ""; }
    else if(c === "\n" || c === "\r"){ if(c === "\r" && text[i + 1] === "\n") i++; row.push(cur); cur = ""; if(row.some(x => x !== "")) rows.push(row); row = []; }
    else cur += c;
  }
  row.push(cur); if(row.some(x => x !== "")) rows.push(row);
  return rows;
}
function parseOldCsv(text){
  const rows = parseCsv(text), names = { [S.settings.nameA]: "a", [S.settings.nameB]: "b" };
  const out = { items: [], bad: [], unknown: new Set() };
  rows.forEach((r, i) => {
    if(i === 0 && /件名/.test(r[0] || "")) return;
    if(r.length < 4){ out.bad.push(r.join(",")); return; }
    const [payer, amt, date] = r.slice(-3), title = r.slice(0, -3).join(",").trim();   // 件名にカンマが入っていても読めるように
    const amount = Math.round(Number(String(amt).replace(/[,\s¥円]/g, "")));
    const m = /^(\d{4})\D+(\d{1,2})\D+(\d{1,2})/.exec(String(date).trim());
    if(!(amount > 0) || !m){ out.bad.push(r.join(",")); return; }
    const ymd = `${m[1]}-${String(m[2]).padStart(2, "0")}-${String(m[3]).padStart(2, "0")}`;
    { const d0 = new Date(ymd + "T00:00:00Z"); if(isNaN(d0) || d0.toISOString().slice(0, 10) !== ymd){ out.bad.push(r.join(",")); return; } }
    const mv = /^(.+?)\s*から\s*(.+)$/.exec(payer.trim());
    if(mv){ const f = names[mv[1].trim()], t = names[mv[2].trim()]; if(!f || !t || f === t){ out.unknown.add(payer.trim()); return; } out.items.push({ title, amount, date: ymd, settle: true, who: f }); return; }
    const w = names[payer.trim()]; if(!w){ out.unknown.add(payer.trim()); return; }
    out.items.push({ title, amount, date: ymd, settle: false, who: w });
  });
  return out;
}
const fnv = str => { let h = 0x811c9dc5; for(const c of str){ h ^= c.codePointAt(0); h = Math.imul(h, 0x01000193) >>> 0; } return h.toString(36); };
const PAYWORD = /^(返金|返済|振込|送金)/;
function buildImport(items, opt){
  const entries = [], settlements = [], seen = new Map();
  for(const r of items){
    const asSettle = r.settle || (opt.pay && PAYWORD.test(r.title));
    const key = [asSettle ? "s" : "e", r.title, r.who, r.amount, r.date].join("|");
    const n = (seen.get(key) || 0) + 1; seen.set(key, n);
    const id = "imp" + fnv(key) + "x" + n, createdAt = Date.parse(r.date + "T12:00:00+09:00") || 0;
    if(asSettle) settlements.push({ id, from: r.who, to: other(r.who), amount: r.amount, date: r.date, note: r.title === "精算" ? "" : r.title.slice(0, 40), createdAt, by: r.who });
    else entries.push({ id, type: "expense", payer: r.who, title: r.title.slice(0, 40), amount: r.amount, date: r.date, share: opt.share, createdAt, updatedAt: createdAt, by: r.who, reactions: {}, category: opt.cat ? autoCatId(r.title) : "" });
  }
  return { entries, settlements };
}
function importSheet(){
  const st = { items: null, bad: [], unknown: [], pay: true, share: 1, cat: true, busy: false, fileName: "" };
  const have = new Set([...S.entries, ...S.settlements].map(x => x.id));
  const calc = () => {
    const b = buildImport(st.items, { pay: st.pay, share: st.share, cat: st.cat });
    // すでにアプリに登録してある記録（払った人・金額・日付が同じ）は、二重にならないようスキップする
    const pool = new Map(), take = k => { const n = pool.get(k) || 0; if(n > 0){ pool.set(k, n - 1); return true; } return false; };
    S.entries.forEach(e => { const k = `e|${e.payer}|${e.amount}|${e.date}`; pool.set(k, (pool.get(k) || 0) + 1); });
    S.settlements.forEach(x => { const k = `s|${x.from}|${x.amount}|${x.date}`; pool.set(k, (pool.get(k) || 0) + 1); });
    let dup = 0;
    const ne = b.entries.filter(x => { if(have.has(x.id)) return false; if(take(`e|${x.payer}|${x.amount}|${x.date}`)){ dup++; return false; } return true; });
    const ns = b.settlements.filter(x => { if(have.has(x.id)) return false; if(take(`s|${x.from}|${x.amount}|${x.date}`)){ dup++; return false; } return true; });
    const before = Math.round(S.entries.reduce((c, e) => c + entryCredit(e), 0) + S.settlements.reduce((c, x) => c + settleCredit(x), 0));
    const credit = before + ne.reduce((c, e) => c + entryCredit(e), 0) + ns.reduce((c, x) => c + settleCredit(x), 0);
    const dates = st.items.map(x => x.date).sort();
    return { b, ne, ns, dup, before, credit: Math.round(credit), from: dates[0], to: dates[dates.length - 1] };
  };
  const html = () => {
    if(!st.items) return `

      <label class="btn primary press" style="text-align:center;cursor:pointer">CSVファイルを選ぶ<input id="imp-file" type="file" accept=".csv,text/csv,text/plain,.txt" hidden></label>
      ${st.err ? `<div class="banner" role="alert">${esc(st.err)}</div>` : ""}`;
    const c = calc(), nameOf = k => S.settings["name" + k.toUpperCase()];
    const dir = c.credit === 0 ? "貸し借りなし" : `${nameOf(c.credit > 0 ? "b" : "a")} → ${nameOf(c.credit > 0 ? "a" : "b")}　${yen(c.credit)}`;
    const payN = st.items.filter(x => !x.settle && PAYWORD.test(x.title)).length;
    return `
      <div class="shead"><button class="link" data-close>閉じる</button><h3>取り込みの確認</h3><span></span></div>
      <div class="form"><div class="frow"><label>ファイル</label><span style="min-width:0;overflow-wrap:anywhere;text-align:right">${esc(st.fileName)}</span></div>
        <div class="frow"><label>立て替え</label><b class="num">${c.ne.length.toLocaleString("ja-JP")}件</b></div>
        <div class="frow"><label>返済</label><b class="num">${c.ns.length.toLocaleString("ja-JP")}件</b></div>

        ${c.dup ? `<div class="frow"><label>登録済みと同じ</label><span class="num">${c.dup.toLocaleString("ja-JP")}件（スキップ）</span></div>` : ""}

        ${S.entries.length + S.settlements.length ? `<div class="frow"><label>いまのアプリ</label><span class="num">${(S.entries.length + S.settlements.length).toLocaleString("ja-JP")}件・${esc(c.before === 0 ? "貸し借りなし" : `${nameOf(c.before > 0 ? "b" : "a")} → ${nameOf(c.before > 0 ? "a" : "b")} ${yen(c.before)}`)}</span></div>` : ""}

  };

      show();
    });

      const pa = ev.target.closest("[data-imp-pay]"); if(pa){ st.pay = pa.dataset.impPay === "1"; show(); return; }
      if(!ev.target.closest("#imp-go") || st.busy) return;
      const c = calc(); const total = c.ne.length + c.ns.length; if(!total) return;
      st.busy = true; st.err = ""; show();
      try{
        const CH = 300; let done = 0;
        const jobs = [...c.ne.map(x => ["entries", x]), ...c.ns.map(x => ["settlements", x])];
        for(let i = 0; i < jobs.length; i += CH){
          const part = jobs.slice(i, i + CH);
          await api("importBulk", { entries: part.filter(j => j[0] === "entries").map(j => j[1]), settlements: part.filter(j => j[0] === "settlements").map(j => j[1]) });
          done += part.length; st.prog = `取り込み中… ${done.toLocaleString("ja-JP")} / ${total.toLocaleString("ja-JP")}`; show();
        }
        closeSheet(); toast(`${total.toLocaleString("ja-JP")}件を取り込みました`); load();
      }catch(err){
        st.busy = false;
        const m = String(err && err.message || err);
        st.err = /UNKNOWN_FN/.test(m) ? "GAS（Code.gs）が古いままです。新しい Code.gs に更新して、再デプロイしてください。" : err && err.network ? "電波がつながっていません。つながる場所で、もう一度試してください。" : "取り込みに失敗しました。もう一度試してください。（" + m.slice(0, 80) + "）";
        show();
      }
    });
  });
}

const buzz = p => { try{ navigator.vibrate && navigator.vibrate(p); }catch{} };
function settleDone(doc, prev){

  const o = document.createElement("div"); o.className = "ov done";
  const cols = ["var(--a)","var(--b)","var(--accent)"];

    <div class="confetti" aria-hidden="true">${conf}</div>

    <div class="thanks" id="thanks">
      <button type="button" data-t="🙏 ありがとう" aria-pressed="false">🙏 ありがとう</button>
      <button type="button" data-t="☕️ 今度カフェ行こう" aria-pressed="false">☕️ 今度カフェ行こう</button></div>
    <button type="button" class="btn primary press" id="doneclose">閉じる</button></div>`;
  document.body.appendChild(o); document.body.classList.add("noscroll");
  requestAnimationFrame(() => requestAnimationFrame(() => o.classList.add("show")));
  const el = $("#doneamt", o);
  if(reduceMotion){ el.innerHTML = `<small>¥</small>0`; }
  else { const t0 = performance.now(), D = 900;
    const tick = t => { const k = Math.min(1, (t - t0) / D), e = 1 - Math.pow(1 - k, 3); el.innerHTML = `<small>¥</small>${comma(Math.round(prev * (1 - e)))}`; if(k < 1 && o.isConnected) requestAnimationFrame(tick); };
    requestAnimationFrame(tick); }
  setTimeout(() => buzz([18, 40, 18]), 600);
  const close = () => { o.remove(); document.body.classList.remove("noscroll"); };
  $("#doneclose", o).onclick = close;
  o.addEventListener("click", ev => { if(ev.target === o) close(); });
  $("#thanks", o).addEventListener("click", ev => {
    const b = ev.target.closest("[data-t]"); if(!b || b.getAttribute("aria-pressed") === "true") return;
    b.setAttribute("aria-pressed", "true"); buzz(10);
    const cur = S.settlements.find(x => x.id === doc.id) || doc;
    const next = { ...cur, note: [cur.note, b.dataset.t].filter(Boolean).join("　").slice(0, 40) };
    upsertLocal("settlements", next); enqueue("saveSettlement", [next]); toast("ひとことを添えました");
  });
}

function trendSheet(){
  const st = { n: 6, cat: "", m: "", shrink: true };
  const short = v => v >= 10000 ? (Math.round(v / 1000) / 10) + "万" : v ? String(v) : "";
  const body = () => {
    const t = ym(today()); const all = []; let m = t;
    for(let i = 0; i <= st.n; i++){ all.unshift(m); m = prevMonth(m); }   // 先頭は「前月比」用の1つ前の月
    const per = all.map(k => { const { rows } = catStats(S.entries.filter(e => ym(e.date) === k)); return new Map(rows.map(r => [r.id, r.sum])); });
    const months = all.slice(1), pm = per.slice(1);
    if(st.m && !months.includes(st.m)) st.m = "";
    const tot = new Map(); pm.forEach(mp => mp.forEach((v, id) => tot.set(id, (tot.get(id) || 0) + v)));
    const ids = [...tot.keys()].sort((a, b) => tot.get(b) - tot.get(a));
    const sums = pm.map(mp => st.cat ? (mp.get(st.cat) || 0) : [...mp.values()].reduce((a, b) => a + b, 0));
    const nz = sums.filter(v => v > 0).sort((a, b) => a - b), med = nz.length ? nz[Math.floor(nz.length / 2)] : 0;
    const top = Math.max(1, ...sums), cap = med * 1.8, outlier = st.shrink && nz.length >= 3 && top > cap * 1.3;
    const max = outlier ? Math.max(cap, 1) : top;
    const cols = months.map((k, i) => {
      const segs = (st.cat ? [st.cat] : ids).filter(id => pm[i].get(id)).map(id => `<i style="height:${pm[i].get(id) / sums[i] * 100}%;background:${catColor(id)}"></i>`).join("");
      const sel = st.m === k;
      return `<button type="button" class="trcol" data-trm="${k}" aria-pressed="${sel}" aria-label="${monthLabel(k)} ${yen(sums[i])}" style="opacity:${st.m && !sel ? .4 : 1}"><span class="trtop">${short(sums[i])}</span><div class="trstack${sums[i] > max ? " cut" : ""}" style="height:${Math.max(0, Math.min(sums[i], max) / max * 128)}px">${segs}</div><span class="trm${k === t || sel ? " now" : ""}">${+k.slice(5)}月</span></button>`;
    }).join("");
    const ri = st.m ? months.indexOf(st.m) + 1 : all.length - 1;   // 基準の月（all上の位置）
    const refM = all[ri], cmpM = all[ri - 1];
    const refTotal = [...per[ri].values()].reduce((a, b) => a + b, 0);
    const rowIds = st.m ? [...per[ri].keys()].sort((a, b) => per[ri].get(b) - per[ri].get(a)) : ids;
    const rows = rowIds.map(id => {
      const c = catOf(id), a = per[ri].get(id) || 0, b = per[ri - 1].get(id) || 0, d = a - b;
      const dl = d === 0 ? "前の月と同じ" : `前の月比 <span class="${d > 0 ? "up" : "dn"}">${d > 0 ? "＋" : "−"}${yen(Math.abs(d))}</span>`;
      const main = st.m ? a : tot.get(id);
      const sub = st.m ? dl : `今月 ${yen(a)}・${dl}`;
      return `<button type="button" class="trrow press" data-trc="${esc(id)}" aria-pressed="${st.cat === id}"><span class="csw" style="background:${catColor(id)}"></span><span><span class="ce">${c.icon}</span> ${esc(c.label)}</span><b class="num">${yen(main)}</b><span class="s2">${sub}</span></button>`;
    }).join("");
    const head = st.m ? `<div style="display:flex;align-items:center;gap:8px;margin:2px 4px 6px"><b style="font-size:16px">${monthLabel(st.m)}の内訳</b><span class="num" style="font-weight:800">${yen(refTotal)}</span><button type="button" class="mini press" data-trgo="${st.m}" style="margin-left:auto">この月のリスト →</button></div>` : "";
    return `<div class="chips" style="margin:4px 0 6px"><button class="chip" data-trn="6" aria-pressed="${st.n === 6}">6か月</button><button class="chip" data-trn="12" aria-pressed="${st.n === 12}">12か月</button>${nz.length >= 3 && top > cap * 1.3 ? `<button class="chip" data-trs aria-pressed="${st.shrink}" style="margin-left:auto">大きい月を縮める</button>` : ""}</div>
      <div class="catcard"><div class="trbars">${cols}</div>
      <span class="sub">${st.cat ? esc(catOf(st.cat).label) + "だけを表示中。" : ""}棒をタップするとその月の内訳、下の行をタップするとそのカテゴリだけ表示します。</span></div>
      <div style="margin-top:10px">${head}${rows || `<div class="empty">この期間の記録はありません</div>`}</div>`;
  };
  openSheet(`<div class="shead"><button class="link" data-close>閉じる</button><h3>月ごとの推移</h3><span></span></div><div id="tr-body">${body()}</div>`, "", sheet => {
    sheet.addEventListener("click", ev => {

      if(go){ S.filter = go.dataset.trgo; S.limit = 300; S.q = ""; S.cat = ""; closeSheet(); goTab("list"); return; }
      const sh = ev.target.closest("[data-trs]"), n = ev.target.closest("[data-trn]"), c = ev.target.closest("[data-trc]"), mm = ev.target.closest("[data-trm]");

      $("#tr-body", sheet).innerHTML = body();
    });
  });
}

  const ex = S.entries.filter(e => ym(e.date) === m && e.type !== "loan");
  const total = ex.reduce((s,e) => s + e.amount, 0);
  const ta = ex.filter(e => e.payer === "a").reduce((s,e) => s + e.amount, 0), tb = total - ta;
  const counts = new Map();
  ex.forEach(e => { const t = e.title || "（件名なし）"; const c = counts.get(t) || { n:0, sum:0 }; c.n++; c.sum += e.amount; counts.set(t, c); });
  const top = [...counts.entries()].sort((a,b) => b[1].n - a[1].n || b[1].sum - a[1].sum).slice(0, 3);
  const biggest = [...ex].sort((a,b) => b.amount - a.amount)[0];
  const days = new Map(); ex.forEach(e => { const d = new Date(e.date + "T00:00:00").getDay(); days.set(d, (days.get(d)||0) + 1); });
  const topDay = [...days.entries()].sort((a,b) => b[1] - a[1])[0];
  const settles = S.settlements.filter(s => ym(s.date) === m).length;
  const pa = total ? Math.round(ta / total * 100) : 50;
  const headline = top.length && top[0][1].n >= 2
    ? `${esc(top[0][0])}に${top[0][1].n}回。`
    : ex.length ? `${ex.length}回、ふたりで立て替えあいました。` : "この月の記録はありません。";
  openSheet(`
    <div class="shead"><button class="link" data-close>閉じる</button><h3>振り返り</h3><span></span></div>
    <article class="recap">
      <div class="mh">${m.slice(0,4)}年${+m.slice(5)}月のふたり</div>
      <p class="headline">${headline}</p>
      <div><div class="sub">立て替えた合計</div><div class="total">${yen(total)}</div><div class="sub">${ex.length}件</div></div>
      <div>
        <div class="ratio" role="img" aria-label="${esc(name("a"))} ${pa}%、${esc(name("b"))} ${100-pa}%"><i class="ra" style="width:${pa}%"></i><i class="rb" style="width:${100-pa}%"></i></div>
        <div class="ratio-l num"><span class="a">${esc(name("a"))} ${yen(ta)}</span><span class="b">${esc(name("b"))} ${yen(tb)}</span></div>
      </div>
      ${catRecapHTML(ex)}
      ${top.length ? `<div><h2>よく使った</h2><ol class="rank">${top.map(([t,c],i) => `<li><span class="n">${i+1}</span><span>${esc(t)}</span><span class="num">${c.n}回・${yen(c.sum)}</span><i class="bar" style="width:${Math.max(8, c.n / top[0][1].n * 100)}%"></i></li>`).join("")}</ol></div>` : ""}
      <div class="facts">
        <div class="fact"><span>いちばん大きかった</span><b>${biggest ? `${esc(biggest.title || "立て替え")} ${yen(biggest.amount)}` : "—"}</b></div>
        <div class="fact"><span>いちばん多い曜日</span><b>${topDay ? `${WD[topDay[0]]}曜日（${topDay[1]}件）` : "—"}</b></div>
        <div class="fact"><span>精算した回数</span><b class="num">${settles}回</b></div>
        <div class="fact"><span>1件あたり</span><b class="num">${ex.length ? yen(total / ex.length) : "—"}</b></div>
      </div>
    </article>`, "", null);
}

/* ================= その他 ================= */
let toastT;
function toast(msg, undo){
  clearTimeout(toastT);
  document.querySelectorAll(".toast").forEach(t => t.remove());
  const t = document.createElement("div");
  t.className = "toast" + (undo ? "" : " plain"); t.setAttribute("role","status");
  t.innerHTML = `<span>${esc(msg)}</span>${undo ? `<button type="button">元に戻す</button>` : ""}`;
  if(undo) t.querySelector("button").onclick = () => { t.remove(); undo(); };
  document.body.appendChild(t);
  toastT = setTimeout(() => t.remove(), undo ? 5000 : 2000);
}
function saveSettings(patch){
  Object.assign(S.settings, patch); applyCats(); cache(); render();
  enqueue("saveSettings", [patch]); // 変えた項目だけ送る（古い内容で相手の設定を上書きしないため）
}
function markSeen(){ S.seenAt = Date.now(); ls.set("seenAt", String(S.seenAt)); }
function exportCsv(){
  const q = v => { let t = String(v ?? ""); if(typeof v === "string" && /^[=+\-@]/.test(t)) t = "'" + t; return `"${t.replace(/"/g, '""')}"`; };
  const lines = [["種別","日付","件名","カテゴリ","払った人","金額","相手の負担","相手が負担する額","登録した人"].map(q).join(",")];
  for(const e of sorted(S.entries)) lines.push([e.type==="loan"?"貸し借り":"立て替え", e.date, e.title, e.category ? catOf(e.category).label : "", name(e.payer), e.amount, e.type==="loan"?"全額":(e.share===1?"全額":"半分"), Math.abs(entryCredit(e)), e.by ? name(e.by) : ""].map(q).join(","));
  for(const s of sorted(S.settlements)) lines.push(["精算", s.date, s.note || "返済", "", name(s.from), s.amount, "", "", s.by ? name(s.by) : ""].map(q).join(","));
  try{
    const url = URL.createObjectURL(new Blob(["﻿" + lines.join("\r\n")], { type: "text/csv" }));
    const a = document.createElement("a"); a.href = url; a.download = `ふたりの立て替え帳_${today()}.csv`;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000);
  }catch{ toast("CSVを保存できませんでした"); }
}

/* ================= 操作 ================= */
function goTab(k){
  if(S.tab === "list" && k !== "list") markSeen();
  if(k === "list"){ S.dotSince = S.seenAt; markSeen(); }
  else S.dotSince = S.seenAt;
  S.tab = k; render(); window.scrollTo(0,0); updateBadge();
}
document.addEventListener("click", ev => {
  const t = ev.target;
  if(t.closest("[data-close]")) return closeSheet();
  if(t.closest("#lockwho button")){ const b = t.closest("#lockwho button"); S.me = b.dataset.v; [...b.parentNode.children].forEach(x => x.setAttribute("aria-pressed", x === b)); return; }
  const tab = t.closest("[data-tab]"); if(tab) return goTab(tab.dataset.tab);
  if(t.closest("[data-refresh]") && !$("#layer").innerHTML) return refresh();
  const th = t.closest("[data-theme-set]"); if(th){ ls.set("theme", th.dataset.themeSet); applyTheme(th.dataset.themeSet); render(); return; }
  const d = t.closest("[data-do]"); if(d){ const k = d.dataset.do; if(k === "settle") settleSheet(); else if(k === "loan") entrySheet(null, "loan"); else if(k === "guide") showGuide(); else if(k === "cats") catEditor(); else if(k === "badge") toggleBadge(); else if(k === "import") importSheet(); else if(k === "autocat") autoCatSheet(); else if(k === "backup") backupNow(d); else exportCsv(); return; }
  if(t.closest("[data-trend]")) return trendSheet();
  const pp = t.closest("[data-person]"); if(pp && !$("#layer").innerHTML) return personSheet(pp.dataset.person);
  const rc = t.closest("[data-recap]"); if(rc) return recapSheet(rc.dataset.recap);
  if($("#layer").innerHTML) return;
  const ed = t.closest("[data-edit]"); if(ed){ const e = S.entries.find(x => x.id === ed.dataset.edit); if(e) entrySheet(e); return; }
  const se = t.closest("[data-settle]"); if(se){ const s = S.settlements.find(x => x.id === se.dataset.settle); if(s) settleSheet(s); return; }
  if(t.closest("[data-mpick]")) return monthPickerSheet();
  const ms = t.closest("[data-mshift]"); if(ms){ const cm = curMonth(); if(cm){ S.filter = shiftMonth(cm, +ms.dataset.mshift); S.limit = 300; render(); } return; }
  const fl = t.closest("[data-filter]"); if(fl){ S.filter = fl.dataset.filter; S.limit = 300; render(); return; }
  if(t.closest("[data-more]")){ S.limit += 300; const lb = $("#listbody"); if(lb) lb.innerHTML = listBodyHTML(); return; }
  const cg = t.closest("[data-catgo]"); if(cg){ S.limit = 300; S.cat = cg.dataset.catgo; S.filter = MONTH_RE.test(cg.dataset.month || "") ? cg.dataset.month : "all"; S.q = ""; return goTab("list"); }
  if(t.closest("[data-catclear]")){ S.cat = ""; render(); return; }
  const m = t.closest("[data-me]"); if(m){ S.me = m.dataset.me; ls.set("me", S.me); render(); return; }
  const ds = t.closest("[data-defshare]"); if(ds) saveSettings({ defaultShare: +ds.dataset.defshare });
});
/* リストの行を左右にスワイプ：右＝編集、左＝削除 */
let lastSwipe = 0;
document.addEventListener("click", ev => { if(Date.now() - lastSwipe < 350){ ev.stopPropagation(); ev.preventDefault(); } }, true);
(function(){
  let cur = null;
  const reset = c => { c.row.style.transform = ""; c.sw.classList.remove("drag","go"); setTimeout(() => { if(!c.sw.classList.contains("drag")) delete c.sw.dataset.dir; }, 300); };
  document.addEventListener("pointerdown", ev => {
    if(ev.pointerType === "mouse" && ev.button !== 0) return;
    const sw = ev.target.closest(".sw"); if(!sw || $("#layer").innerHTML) return;
    cur = { sw, row: sw.querySelector(".row"), x: ev.clientX, y: ev.clientY, dx: 0, on: false, id: ev.pointerId, W: sw.offsetWidth };
  });
  document.addEventListener("pointermove", ev => {
    if(!cur || ev.pointerId !== cur.id) return;
    const dx = ev.clientX - cur.x, dy = ev.clientY - cur.y;
    if(!cur.on){
      if(Math.abs(dy) > 10 && Math.abs(dy) >= Math.abs(dx)){ cur = null; return; }
      if(Math.abs(dx) > 12 && Math.abs(dx) > Math.abs(dy) * 1.5){ cur.on = true; cur.sw.classList.add("drag"); try{ cur.row.setPointerCapture(ev.pointerId); }catch{} } else return;
    }
    cur.dx = dx; cur.row.style.transform = `translateX(${dx}px)`;
    cur.sw.dataset.dir = dx > 0 ? "r" : "l";
    const go = Math.abs(dx) > Math.max(84, cur.W * .3);
    if(go !== cur.sw.classList.contains("go")){ cur.sw.classList.toggle("go", go); if(go) buzz(8); }
  });
  const end = ev => {
    if(!cur || ev.pointerId !== cur.id) return;
    const c = cur; cur = null;
    if(!c.on) return;
    lastSwipe = Date.now();
    const go = ev.type === "pointerup" && Math.abs(c.dx) > Math.max(84, c.W * .3);
    if(!go){ reset(c); return; }
    const kind = c.sw.dataset.kind, id = c.sw.dataset.id, del = c.dx < 0;
    if(!del){ reset(c); kind === "settle" ? settleSheet(S.settlements.find(x => x.id === id)) : entrySheet(S.entries.find(x => x.id === id)); return; }
    c.sw.classList.remove("drag"); c.row.style.transform = `translateX(${-c.W}px)`;
    setTimeout(() => {
      if(kind === "settle"){ const x = S.settlements.find(y => y.id === id); x && deleteSettleUndo(x); }
      else { const x = S.entries.find(y => y.id === id); x && deleteEntryUndo(x); }
    }, 200);
  };
  document.addEventListener("pointerup", end); document.addEventListener("pointercancel", end);
})();
document.addEventListener("compositionend", ev => { if(ev.target.id === "q") ev.target.dispatchEvent(new Event("input", { bubbles: true })); });
document.addEventListener("input", ev => {
  if(ev.target.id === "q" && !ev.isComposing){ S.q = ev.target.value; S.limit = 300; const lb = $("#listbody"); if(lb) lb.innerHTML = listBodyHTML(); }
});
document.addEventListener("change", ev => {
  if(ev.target.id === "nA" || ev.target.id === "nB"){
    const v = ev.target.value.trim(); if(!v) return render();
    saveSettings(ev.target.id === "nA" ? { nameA: v } : { nameB: v }); toast("名前を変更しました");
  }
});
document.addEventListener("submit", ev => {
  if(ev.target.id !== "lockform") return;
  ev.preventDefault();
  if(!S.me){ toast("あなたがどちらか選んでください"); return; }
  ls.set("me", S.me);
  S.pass = $("#pass").value.trim(); ls.set("pass", S.pass); S.err = "";
  S.locked = false; S.ready = false; render(); load();
});
$("#fab").addEventListener("click", () => entrySheet(null));
document.addEventListener("keydown", ev => { if(ev.key === "Escape" && $("#layer").innerHTML) closeSheet(); });

/* ================= 起動 ================= */
if(!S.pass || !S.me){ S.locked = true; S.ready = true; render(); }
else {
  try{ const c = JSON.parse(ls.get("cache", "null")); if(c){ if(c.settings) Object.assign(S.settings, c.settings); applyCats(); S.entries = c.entries || []; S.settlements = c.settlements || []; S.ready = true; } }catch{}
  render(); load();
}
if("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
/* ---- 画面を引っ張って更新 ---- */
(() => {
  const el = document.createElement("div"); el.id = "ptr"; el.setAttribute("aria-hidden", "true"); el.innerHTML = I.refresh; document.body.appendChild(el);
  let y0 = 0, x0 = 0, pull = 0, on = false;
  const TH = 70, setP = (d, snap) => { el.style.transition = snap ? "transform .25s,opacity .25s" : "none"; el.style.transform = `translate(-50%,${d - 44}px) rotate(${d * 4}deg)`; el.style.opacity = Math.min(1, d / TH); el.classList.toggle("ready", d >= TH); };
  addEventListener("touchstart", e => {
    on = false; if(e.touches.length !== 1 || window.scrollY > 0 || $("#layer").innerHTML || refreshing || e.target.closest("input,textarea,.sw.open")) return;
    y0 = e.touches[0].clientY; x0 = e.touches[0].clientX; pull = 0; on = true;
  }, { passive: true });
  addEventListener("touchmove", e => {
    if(!on) return; const dy = e.touches[0].clientY - y0, dx = e.touches[0].clientX - x0;
    if(dy <= 0 || Math.abs(dx) > dy) { if(pull){ pull = 0; setP(0, true); } if(dy <= 0) on = window.scrollY <= 0 ? on : false; return; }
    if(window.scrollY > 0){ on = false; setP(0, true); return; }
    pull = Math.min(110, dy * 0.5); setP(pull); if(e.cancelable) e.preventDefault();
  }, { passive: false });
  const end = () => { if(!on) return; on = false; const go = pull >= TH; pull = 0; setP(0, true); if(go) refresh(); };
  addEventListener("touchend", end, { passive: true }); addEventListener("touchcancel", end, { passive: true });
})();
document.addEventListener("pointerdown", e => {
  const v = e.target.closest && e.target.closest(".amtview"); if(!v) return;
  v.classList.remove("tap"); void v.offsetWidth; v.classList.add("tap");
  try{ navigator.vibrate && navigator.vibrate(8); }catch{}
});
document.addEventListener("animationend", e => { if(e.animationName === "amtTap") e.target.classList.remove("tap"); });
window.addEventListener("online", () => { if(S.locked || !S.pass) return; S.offline = false; flush(); load(); });
window.addEventListener("offline", () => { S.offline = true; renderStatus(); });
document.addEventListener("visibilitychange", () => {
  if(document.hidden){ if(S.tab === "list") markSeen(); return; }
  if(S.pass && !S.locked){ flush(); load(); }
});
setInterval(() => {
  if(document.hidden || !S.pass || S.locked) return;
  if(Q.length) flush(); else if(!$("#layer").innerHTML) load();
}, 10000);
})();
</script>
